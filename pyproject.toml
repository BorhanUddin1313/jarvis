[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "A modular, voice-controlled personal AI assistant"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "piper-tts>=1.3",
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]